<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c1417">
  <title>FITSOLO — 登录你的专属健身计划</title>
  <meta name="description" content="登录 FITSOLO，继续你的专属训练计划与智能健身旅程。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="FITSOLO that works for you!">
  <meta property="og:description" content="AI × OPC 智能私教，为你制定计划、监督打卡并持续调整。">
  <meta property="og:url" content="https://fitsolo-ai-gcc1021.fuzzy-shrew-9655.chatgpt.site/">
  <meta property="og:image" content="https://fitsolo-ai-gcc1021.fuzzy-shrew-9655.chatgpt.site/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FITSOLO that works for you!">
  <meta name="twitter:description" content="AI × OPC 智能私教，为你制定计划、监督打卡并持续调整。">
  <meta name="twitter:image" content="https://fitsolo-ai-gcc1021.fuzzy-shrew-9655.chatgpt.site/og.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d7ff45'/%3E%3Ctext x='50' y='68' font-size='58' font-weight='900' text-anchor='middle' fill='%23101716' font-family='Arial'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="css/auth.css?v=0.7.0">
  <link rel="stylesheet" href="css/agent-widget.css?v=0.6.2">
</head>
<body>
  <main class="auth-experience">
    <section class="auth-screen" id="authScreen" aria-labelledby="authTitle" inert>
      <div class="background-credit">Mountain image via Unsplash</div>

      <article class="glass-card">
        <header class="brand-row">
          <button class="brand brand-button" id="brandBackButton" type="button" aria-label="返回 FITSOLO 引导页">
            <span class="brand-mark">F</span>
            <span>FITSOLO</span>
          </button>
          <span class="brand-note">YOUR PACE · YOUR PLAN</span>
        </header>

        <div class="card-body">
          <section class="welcome-panel" aria-label="FITSOLO 会员体验介绍">
            <div>
              <p class="eyebrow">MEMBER ACCESS</p>
              <h1 id="authTitle">Welcome<br>back.</h1>
              <p class="intro">你的计划、进度和下一次训练都已准备好。安全登录，继续保持节奏。</p>
            </div>

            <ol class="journey-steps" aria-label="登录流程">
              <li class="is-active"><span>01</span><strong>验证身份</strong></li>
              <li><span>02</span><strong>进入计划</strong></li>
              <li><span>03</span><strong>继续训练</strong></li>
            </ol>
          </section>

          <section class="login-panel">
            <div class="login-heading">
              <p class="step-label">01 / SIGN IN</p>
              <h2 id="loginModeTitle">手机号密码登录</h2>
              <p id="loginModeDescription">使用演示会员账号登录，继续你的专属训练计划。</p>
            </div>

            <form id="authForm" novalidate>
              <div class="login-fields">
                <div class="field">
                  <label for="telephone">手机号</label>
                  <input id="telephone" name="telephone" type="tel" autocomplete="username" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" required>
                </div>

                <div class="field">
                  <label for="password">密码</label>
                  <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="6" inputmode="numeric" placeholder="请输入 6 位密码" required>
                </div>
              </div>

              <label class="agreement-row" for="agreement">
                <input id="agreement" name="agreement" type="checkbox">
                <span class="custom-check" aria-hidden="true"></span>
                <span>我已阅读并同意<a href="legal.html#terms" target="_blank" rel="noopener">《用户协议》</a>与<a href="legal.html#privacy" target="_blank" rel="noopener">《隐私政策》</a></span>
              </label>

              <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

              <div class="flow-actions">
                <button class="back-action" id="backButton" type="button">
                  <span aria-hidden="true">←</span>
                  <span>返回上一步</span>
                </button>
                <button class="primary-action" id="submitButton" type="submit">
                  <span id="primaryActionText">登录并进入</span>
                  <span aria-hidden="true">→</span>
                </button>
              </div>

              <button class="guest-login-button" id="guestLoginButton" type="button">
                <span>游客登录</span>
                <span aria-hidden="true">无需账号 →</span>
              </button>
            </form>

            <div class="divider"><span>其他登录方式</span></div>

            <div class="social-actions">
              <button class="social-button" type="button" data-provider="WeChat" data-oauth-path="/oauth2/authorize/wechat" aria-label="使用微信登录">
                <span class="social-icon wechat-icon" aria-hidden="true">微</span>
                <span>微信登录</span>
              </button>
              <button class="social-button" type="button" data-provider="QQ" data-oauth-path="/oauth2/authorize/qq" aria-label="使用 QQ 登录">
                <span class="social-icon qq-icon" aria-hidden="true">Q</span>
                <span>QQ 登录</span>
              </button>
            </div>
          </section>
        </div>
      </article>
    </section>

    <section class="landing-screen" id="landingScreen" aria-labelledby="landingTitle">
      <canvas class="landing-rings" id="landingRings" aria-hidden="true"></canvas>
      <div class="landing-grain" aria-hidden="true"></div>
      <a class="landing-brand" href="index.html" aria-label="FITSOLO 首页">
        <span class="brand-mark brand-mark-light">F</span>
        <span>FITSOLO</span>
      </a>

      <div class="landing-content">
        <p class="landing-kicker">PERSONAL FITNESS, REIMAGINED</p>
        <h2 id="landingTitle">FITSOLO that<br>works for <em>you!</em></h2>
        <button class="enter-button" id="enterButton" type="button" aria-controls="authScreen" aria-expanded="false">
          <span>Enter</span>
          <span class="enter-arrow" aria-hidden="true">→</span>
        </button>
      </div>

      <p class="landing-footnote">MOVE WITH PURPOSE · 2026</p>
    </section>
  </main>

  <script src="js/landing-rings.js?v=0.5.0"></script>
  <script src="js/auth-state.js?v=0.7.0"></script>
  <script src="js/auth.js?v=0.7.0"></script>
  <script src="js/agent-widget.js?v=0.6.2"></script>
</body>
</html>
