<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡监督 — FITSOLO 智能私教</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23c8f542'/%3E%3Ctext x='50' y='68' font-size='58' font-weight='900' text-anchor='middle' fill='%230a0e14' font-family='Arial'%3EF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/agent-widget.css?v=0.6.2">
</head>
<body>
<div id="site-nav"></div>

<header class="hero" style="padding: 56px 0 40px;">
  <div class="container">
    <span class="hero-badge">② CHECKER · 打卡监督</span>
    <h1 style="font-size: clamp(28px, 4vw, 42px);">教练盯着你练</h1>
    <p class="lead">每天 1 分钟打卡：训练、饮食、体重、睡眠。连续打卡有激励，漏卡 3 天教练会主动找你。</p>
  </div>
</header>

<section class="section" style="padding-top: 10px;">
  <div class="container">
    <div id="notice" class="card" style="display:none;margin-bottom:18px;border-color:rgba(255,200,87,0.4);background:rgba(255,200,87,0.06);"></div>

    <div class="stats-row">
      <div class="stat fire"><b id="statStreak">0</b><span>连续打卡 (天)</span></div>
      <div class="stat good"><b id="statRate">0%</b><span>本周训练完成率</span></div>
      <div class="stat info"><b id="statDays">0</b><span>本周已打卡天数</span></div>
      <div class="stat info"><b id="statTrend">—</b><span>本周体重趋势 (kg)</span></div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <h4 style="margin-bottom:4px;">里程碑进度</h4>
      <p class="muted small" id="milestoneText">距下一个里程碑还剩 7 天</p>
      <div style="height:10px;background:var(--surface2);border-radius:999px;margin-top:10px;overflow:hidden;">
        <div id="milestoneBar" style="height:100%;width:0%;background:var(--accent);border-radius:999px;transition:width .3s;"></div>
      </div>
    </div>

    <div class="grid-2">
      <form id="checkinForm" class="card">
        <h3 style="margin-bottom:14px;">今日打卡</h3>
        <div class="form-grid" style="margin-bottom:14px;">
          <div class="field">
            <label>训练完成</label>
            <div class="radio-pills">
              <label><input type="radio" name="trained" value="yes"><span>✅ 完成</span></label>
              <label><input type="radio" name="trained" value="no" checked><span>❌ 没练</span></label>
            </div>
          </div>
          <div class="field">
            <label>饮食执行</label>
            <div class="radio-pills">
              <label><input type="radio" name="dietOk" value="yes"><span>✅ 按方案</span></label>
              <label><input type="radio" name="dietOk" value="partial" checked><span>部分</span></label>
              <label><input type="radio" name="dietOk" value="no"><span>❌ 没执行</span></label>
            </div>
          </div>
          <div class="field">
            <label>体重 (kg，选填)</label>
            <input type="number" name="weight" id="ckWeight" step="0.1" min="30" max="200" placeholder="如 69.8">
          </div>
          <div class="field">
            <label>睡眠 (小时)</label>
            <select name="sleep" id="ckSleep">
              <option value="6">不足 6</option>
              <option value="6.5">6.5</option>
              <option value="7">7</option>
              <option value="7.5" selected>7.5</option>
              <option value="8">8</option>
              <option value="9">9+</option>
            </select>
          </div>
          <div class="field">
            <label>精力 (1-10)</label>
            <select name="energy" id="ckEnergy">
              <option value="3">3 很差</option>
              <option value="4">4</option>
              <option value="5" selected>5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8 很好</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label>备注（选填）</label>
          <textarea name="note" id="ckNote" placeholder="如：膝盖有点疼 / 加班没时间 / 今天吃多了…"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">提交今日打卡</button>
        <p class="hint" style="margin-top:8px;">数据仅保存在你的浏览器本地，可随时删除。</p>
      </form>

      <div>
        <div class="card" style="margin-bottom:18px;">
          <h4>最近 7 天打卡</h4>
          <div class="bar-chart" id="weekBars"></div>
        </div>
        <div class="card">
          <h4>打卡历史 <span class="muted small">(最近 10 条)</span></h4>
          <div class="history-list" id="history"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="agents/knowledge.js"></script>
<script src="agents/planner-core.js"></script>
<script src="agents/checker-core.js"></script>
<script src="agents/coach-core.js"></script>
<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script src="js/checker.js"></script>
<script src="js/agent-widget.js?v=0.6.2"></script>
</body>
</html>
